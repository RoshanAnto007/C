<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Country</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="container">

        <!-- HEADER -->
        <header class="header">

            <div class="logo">
                🌍
            </div>

            <div>
                <h1>Guess The Country</h1>
                <p>Test your geography knowledge</p>
            </div>

        </header>


        <!-- PLAYER SETUP -->
        <section class="player-card">

            <label for="playerName">
                👤 Player Name
            </label>

            <input
                type="text"
                id="playerName"
                placeholder="Enter your name"
                maxlength="20"
            >

        </section>


        <!-- GAME STATS -->
        <section class="stats">

            <div class="stat">
                <span>🏆</span>
                <div>
                    <small>Score</small>
                    <strong id="score">0</strong>
                </div>
            </div>

            <div class="stat">
                <span>🔥</span>
                <div>
                    <small>Streak</small>
                    <strong id="streak">0</strong>
                </div>
            </div>

            <div class="stat">
                <span>⏱️</span>
                <div>
                    <small>Time</small>
                    <strong id="timer">30</strong>
                </div>
            </div>

        </section>


        <!-- GAME CARD -->
        <section class="game-card">

            <div class="game-header">

                <span class="badge">
                    🌏 ASIA & EUROPE
                </span>

                <span id="round">
                    Round 1
                </span>

            </div>


            <!-- TIMER BAR -->
            <div class="timer-container">

                <div id="timerBar"></div>

            </div>


            <div class="question">

                <p class="question-label">
                    WHERE IS THIS COUNTRY?
                </p>

                <h2 id="continent">
                    🌎 Loading...
                </h2>

            </div>


            <!-- HINT -->
            <div class="hint-box">

                <span>💡</span>

                <p id="hint">
                    Start guessing to reveal hints.
                </p>

            </div>


            <!-- INPUT -->
            <div class="input-area">

                <input
                    type="text"
                    id="guessInput"
                    placeholder="Enter country name..."
                    autocomplete="off"
                >

                <button id="guessButton">
                    GUESS
                </button>

            </div>


            <!-- ATTEMPTS -->
            <div class="attempts">

                <span>Attempts:</span>

                <div id="hearts">
                    ❤️ ❤️ ❤️ ❤️ ❤️
                </div>

            </div>


            <!-- MESSAGE -->
            <div id="message"></div>


            <!-- NEXT GAME -->
            <button
                id="newGameButton"
                class="new-game"
            >
                🔄 NEW GAME
            </button>

        </section>


        <!-- LEADERBOARD -->
        <section class="leaderboard-card">

            <div class="leaderboard-header">

                <div>
                    <span class="trophy">🏆</span>

                    <div>
                        <h2>Leaderboard</h2>
                        <p>Top 10 Players</p>
                    </div>
                </div>

                <button
                    id="clearLeaderboard"
                    class="clear-button"
                >
                    Clear
                </button>

            </div>


            <div id="leaderboardList">

                <!-- Leaderboard generated by JavaScript -->

            </div>

        </section>


        <footer>

            <p>
                🌍 Guess The Country • Geography Challenge
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
