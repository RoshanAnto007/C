<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Country 🌍</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🌍 Guess The Country</h1>

        <p class="subtitle">Asia & Europe Edition</p>

        <div class="game-card">

            <h2 id="continent">
                Hint: Loading...
            </h2>

            <p id="letterHint">
                First letter: ?
            </p>

            <input
                type="text"
                id="guessInput"
                placeholder="Enter country name..."
                autocomplete="off"
            >

            <button onclick="checkGuess()">
                GUESS 🎯
            </button>

            <p id="attempts">
                ❤️ Attempts Left: 5
            </p>

            <p id="message"></p>

        </div>

        <button class="new-game" onclick="newGame()">
            🔄 New Game
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
